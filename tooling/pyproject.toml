[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cohesian-research-storage"
version = "0.1.0"
description = "Storage discovery and resolution for Cohesian Research"
requires-python = ">=3.11"

[project.scripts]
research-storage = "research_storage.cli:main"

[tool.setuptools]
packages = ["research_storage"]
