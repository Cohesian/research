version = 2

[contributor]
id = "research"

[stores.local]
kind = "directory"
enabled = true
origin = "."

[stores.github]
kind = "remote"
enabled = true

[stores.youtube]
kind = "publication"
enabled = true

[[inventory]]
hierarchy = ["documents"]
path = "storage/documents/resources.toml"

[[inventory]]
hierarchy = ["code"]
path = "storage/projects/code/resources.toml"

[[inventory]]
hierarchy = ["media"]
path = "storage/projects/media/resources.toml"
