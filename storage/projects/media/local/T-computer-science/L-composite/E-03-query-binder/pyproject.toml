[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cohesian-query-binder-scene"
version = "2.0.0"
description = "Standalone Loci scene for the Query Binder k-graph resource"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "loci @ git+ssh://git@github.com/Cohesian/loci.git@e25c0b3782b62e4b4d46ead79996b7c60feb56e2",
    "loci-plugins @ git+ssh://git@github.com/Cohesian/loci-plugins.git@b1c5c38eaf7d3a633f4c7fa500009b0121f900ac",
    "manim==0.21.0",
    "manim-voiceover[openai,transcribe,gtts]==0.4.0",
]

[tool.setuptools]
packages = []
